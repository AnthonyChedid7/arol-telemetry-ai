data:
  pools:
    sample:
      - data/sample.csv

  # The team contract (docs/contract.md) defines ts as UTC; timestamps are used
  # exactly as recorded and shown as UTC in every report.
  timezone: UTC

  # null = auto-detect the head count from the CSV columns (team contract).
  n_heads: null

  # Checked by the ingestion validation report.
  units:
    AppTorque: Nm

  # Upper bound on events materialized for one question; broader questions are
  # asked to narrow their scope.
  max_loaded_events: 1000000
  # Re-hash every partition against the manifest on each read (slow, thorough).
  verify_pool_hashes: false

analytics:
  torque_expected_min: 1.5
  torque_expected_max: 2.5
  drift_window_seconds: 3600
  idle_window_seconds: 300
  anomaly_sigma: 3.0
  # Drift is reported only above this rate of change of the moving average.
  # Practical value pending AROL validation (expected range is 1.5-2.5 Nm).
  drift_threshold_nm_per_hour: 0.05
  # Events whose status contradicts torque at this boundary are flagged.
  status_torque_mismatch_nm: 0.5
  # Groups with fewer events are reported as below the minimum sample size.
  min_n: 30
  # Upper bound on hourly/daily buckets in one time-series question.
  max_time_buckets: 1000

agent:
  # Upper bound on tool calls in one plan; larger plans are refused, not truncated.
  max_steps: 8
  llm:
    model: qwen2.5-coder:14b
  # Claude planner (agent.planner: claude). The API key is read from the
  # ANTHROPIC_API_KEY environment variable; never put it in this file.
  claude:
    model: claude-opus-5-5
    effort: low
    max_tokens: 16000
    timeout_seconds: 30      # per attempt; with max_retries 1 an outage falls back in ~1 min
    max_retries: 1
    max_question_chars: 1000 # longer questions are refused before any API call
    fallback_to_rules: true  # only when Claude is unreachable; misconfiguration is reported
